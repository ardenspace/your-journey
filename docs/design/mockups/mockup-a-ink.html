<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:390px; height:844px; overflow:hidden; }
  body {
    background:#FFFDF7;
    font-family:"Apple SD Gothic Neo",-apple-system,sans-serif;
    color:#3A3A3A;
    display:flex; flex-direction:column;
  }
  .header { padding:56px 28px 8px; }
  .date { font-size:15px; color:#8A8578; letter-spacing:0.08em; }
  .title-row { display:flex; align-items:center; gap:10px; margin-top:6px; }
  .title { font-size:24px; font-weight:700; letter-spacing:0.02em; }
  canvas.spark-h { width:14px; height:14px; image-rendering:pixelated; }
  .journey { flex:1; position:relative; margin-top:4px; }
  canvas.scene { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  .milestone-note {
    position:absolute; left:28px; bottom:10px;
    font-size:15px; color:#8A8578;
  }
  .card {
    margin:0 20px 18px; background:#FFFFFF;
    border:1px solid #3A3A3A; padding:22px 22px 20px;
    position:relative;
  }
  .card::after {
    content:""; position:absolute; left:4px; top:4px; right:-5px; bottom:-5px;
    border:1px solid #3A3A3A; opacity:0.18; z-index:-1;
  }
  .card-label { font-size:14px; color:#8A8578; letter-spacing:0.14em; margin-bottom:10px; }
  .question { font-size:20px; line-height:1.55; }
  .btn {
    margin-top:18px; display:inline-block;
    border:1px solid #3A3A3A; padding:12px 18px;
    font-size:17px; background:#FFFDF7;
  }
  .footer { padding:0 28px 40px; display:flex; justify-content:space-between; }
  .footer span { font-size:15px; color:#8A8578; }
</style>
</head>
<body>
  <div class="header">
    <div class="date">8월 13일 수요일</div>
    <div class="title-row">
      <div class="title">당신의 여정</div>
      <canvas class="spark-h" id="sparkH" width="7" height="7"></canvas>
    </div>
  </div>

  <div class="journey">
    <canvas class="scene" id="scene" width="100" height="115"></canvas>
    <div class="milestone-note">일곱 걸음째 걷는 중이에요</div>
  </div>

  <div class="card">
    <div class="card-label">오늘의 질문</div>
    <div class="question">요즘 하루 중 마음이 가장<br>느긋해지는 시간은 언제인가요?</div>
    <div class="btn">이 이야기 써 볼까요?</div>
  </div>

  <div class="footer"><span>지난 이야기</span><span>설정</span></div>

<script>
const INK='#3A3A3A', SUB='#8A8578', ACC='#C08A5D', APRICOT='#E9B48C';
function painter(id){
  const c=document.getElementById(id), ctx=c.getContext('2d');
  return (x,y,col,a)=>{ ctx.globalAlpha=(a===undefined?1:a); ctx.fillStyle=col; ctx.fillRect(x,y,1,1); ctx.globalAlpha=1; };
}
/* header sparkle ✦ */
{
  const p=painter('sparkH');
  [[3,0],[3,1],[3,2],[3,3],[3,4],[3,5],[3,6],[0,3],[1,3],[2,3],[4,3],[5,3],[6,3],[2,2],[4,4],[2,4],[4,2]]
    .forEach(([x,y])=>p(x,y,ACC));
}
/* journey scene — ink engraving feel, denser */
{
  const p=painter('scene');
  // path curve points (bottom-left → top-right, gentle S)
  const pts=[];
  for(let t=0;t<=1;t+=0.006){
    const x = 14 + t*72 + Math.sin(t*Math.PI*1.6)*(-11);
    const y = 96 - t*74;
    pts.push([Math.round(x),Math.round(y)]);
  }
  const walkedEnd = Math.floor(pts.length*0.72);
  // walked path: dense stitched dots (dashed line)
  let last=null;
  for(let i=0;i<walkedEnd;i+=3){
    const [x,y]=pts[i];
    if(last && last[0]===x && last[1]===y) continue;
    p(x,y,INK,0.85); p(x+1,y,INK,0.85);
    last=[x,y];
  }
  // path ahead: sparse faint dots
  for(let i=walkedEnd;i<pts.length;i+=7){
    const [x,y]=pts[i]; p(x,y,INK,0.28);
  }
  function grass(x,y,a){ a=a||0.5; p(x,y-1,INK,a); p(x-1,y,INK,a); p(x+1,y,INK,a); }
  function flowerInk(x,y,center){
    // stem + leaves
    p(x,y,INK); p(x,y-1,INK); p(x,y-2,INK); p(x,y-3,INK);
    p(x-1,y-1,INK,0.7); p(x+1,y-2,INK,0.7);
    // petal ring (2px petals, engraved)
    p(x-1,y-5,INK); p(x-2,y-5,INK,0.8);
    p(x+1,y-5,INK); p(x+2,y-5,INK,0.8);
    p(x,y-6,INK); p(x,y-7,INK,0.8);
    p(x,y-4,INK);
    p(x-1,y-6,INK,0.5); p(x+1,y-6,INK,0.5); p(x-1,y-4,INK,0.5); p(x+1,y-4,INK,0.5);
    // center
    p(x,y-5,center||'#FFFDF7');
  }
  function sparkle(x,y,col,a){
    p(x,y,col,a); p(x,y-1,col,a); p(x,y+1,col,a); p(x-1,y,col,a); p(x+1,y,col,a);
    p(x,y-2,col,a*0.5); p(x,y+2,col,a*0.5); p(x-2,y,col,a*0.5); p(x+2,y,col,a*0.5);
  }
  // milestone flowers along walked path
  flowerInk(24,95,APRICOT);
  flowerInk(11,74);
  flowerInk(38,68,APRICOT);
  flowerInk(48,49);
  // grass tufts
  grass(33,96); grass(52,82); grass(20,58,0.4); grass(62,64); grass(76,40,0.4);
  grass(42,88,0.35); grass(58,52,0.35); grass(28,78,0.3);
  // capsule mound + bud at end of walked path
  const [mx0,my0]=pts[walkedEnd]; const mx=mx0, my=my0-1;
  for(let dx=-3;dx<=3;dx++) p(mx+dx,my,INK,0.85);
  for(let dx=-2;dx<=2;dx++) p(mx+dx,my-1,INK,0.85);
  p(mx-1,my-2,INK,0.4); p(mx+1,my-2,INK,0.4);
  // bud (accent — the one colored thing)
  p(mx,my-3,INK); p(mx,my-4,INK);
  p(mx-1,my-5,ACC); p(mx+1,my-5,ACC); p(mx,my-6,ACC); p(mx,my-5,APRICOT);
  // magic sparkles near bud
  sparkle(mx-6,my-9,ACC,0.9); sparkle(mx+6,my-12,ACC,0.55); p(mx+4,my-6,ACC,0.5);
  // faint dither band at bottom (ground texture)
  for(let x=4;x<96;x+=1){
    for(let y=102;y<110;y+=1){
      if((x+y)%2===0 && Math.sin(x*2.7+y*1.3)>0.55) p(x,y,INK,0.1);
    }
  }
  // engraved hill hatching top-right
  for(let x=70;x<98;x++){
    const y=Math.round(16+Math.sin((x-70)/28*Math.PI)*-5);
    p(x,y,INK,0.3);
    if(x%3===0) p(x,y+1,INK,0.15);
  }
  // tiny birds
  p(20,20,INK,0.5); p(21,19,INK,0.5); p(22,20,INK,0.5);
  p(30,26,INK,0.35); p(31,25,INK,0.35); p(32,26,INK,0.35);
}
</script>
</body>
</html>
